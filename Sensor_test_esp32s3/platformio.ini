[env:esp32s3_sps30_idf]
platform = espressif32@6.11.0
platform_packages = platformio/tool-esptoolpy@2.40900.250804
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf

; --- ESP32-S3 DevKitC-1 N16R8 memory configuration ---
board_build.flash_size = 16MB
; esptool image header expects <=80m; runtime still uses 120m via sdkconfig
board_build.f_flash = 80000000L
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB

; --- LittleFS filesystem ---
board_build.filesystem = littlefs

; --- USB Serial/JTAG upload (native USB on ESP32-S3) ---
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

monitor_speed = 115200

; --- Build configuration ---
build_type = release
build_flags =

; --- Serial monitor helpers ---
monitor_filters =
    time
    esp32_exception_decoder

; --- Upload speed ---
upload_speed = 921600

; --- Board specific sdkconfig overrides ---
board_build.sdkconfig_path = sdkconfig.esp32s3_sps30_idf
